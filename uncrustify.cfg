# >0: 候选之间最多跳过此数量的预处理行。
#
# 默认值: -1
align_func_proto_span_num_pp_lines = -1 # number

# align_func_proto_span 中可跳过的注释行最大预算。
# -1: 使用 global_span_num_cmt_lines 预算（默认）。
# 0: 无预算（不跳过任何注释行）。
# >0: 候选之间最多跳过此数量的注释行。
#
# 默认值: -1
align_func_proto_span_num_cmt_lines = -1 # number

# 函数原型对齐中如何处理 '*'。
#
# 0: 类型的一部分，'void * foo();'（默认）
# 1: 函数的一部分，'void *foo();'

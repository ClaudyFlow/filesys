# true: 宏同一行的大括号增加缩进
# false: 宏同一行的大括号不增加缩进
#
# 默认值: true
indent_macro_brace = false # true/false

# 续写的 '->' 或 '.' 的缩进空格数。通常设为 0、1 或 indent_columns。
indent_member = 0 # unsigned number

# 在 '.' 或 '->' 处断开的行是否缩进一级。若设为 true，indent_member 选项无效。
indent_member_single = false # true/false

# 代码前行内 ('//') 注释的缩进空格数。
indent_single_line_comments_before = 0 # unsigned number

# 代码后行内 ('//') 注释的缩进空格数。
indent_single_line_comments_after = 0 # unsigned number

# 打开控制语句（if、for、while 等）的括号时，增加此值的缩进级别。负值减少缩进级别。
indent_sparen_extra = 0 # number

# 是否相对于代码缩进尾随单行 ('//') 注释，而非尝试保持相同的绝对列。
indent_relative_single_line_comments = false # true/false

# 'case' 相对于 'switch' 的缩进空格数。通常为 0 或 indent_columns。建议与 indent_case_brace 选择相同的值。
indent_switch_case = indent_columns # unsigned number

# 'switch' 主体在 'case' 之前的缩进空格数。通常与 indent_columns 或 indent_switch_case 相同。
indent_switch_body = 0 # unsigned number

# 是否忽略 'case' 后 '{' 的缩进。
indent_ignore_case_brace = false # true/false

# '{' 相对于 'case' 的缩进空格数。默认情况下，大括号将出现在 case 的 'c' 下方。通常设为 0 或 indent_columns。负值也有效。建议与 indent_switch_case 选择相同的值。
indent_case_brace = 0 # number

# 'break' 与 'switch' 中的 'case' 对齐。
indent_switch_break_with_case = false # true/false

# 是否缩进 switch 语句内的预处理语句。
#
# 默认值: true
indent_switch_pp = false # true/false

# 平移 'case' 行的空格数，不影响其他行。通常为 0。
indent_case_shift = 0 # unsigned number

# 是否将 'case' 前的注释与 'case' 对齐。
indent_case_comment = true # true/false

# 是否缩进非第一列的注释。
indent_comment = true # true/false

# 是否缩进第一列的注释。
indent_col1_comment = true # true/false

# 是否缩进第一列的多行字符串字面量。
indent_col1_multi_string_literal = false # true/false

# 对齐相邻行中相距此列数或更少的注释。
#
# 默认值: 3
indent_comment_align_thresh = 3 # unsigned number

# 是否忽略 goto 标签的缩进。
indent_ignore_label = false # true/false

# 如何缩进 goto 标签。需要 indent_ignore_label=false。
#
# >0: 绝对列，1 为最左列
# <=0: 从大括号缩进中减去
#
# 默认值: 1
indent_label = 1 # number

# 如何缩进后跟冒号的访问说明符。
#
# >0: 绝对列，1 为最左列
# <=0: 从大括号缩进中减去
#
# 默认值: 1
indent_access_spec = 1 # number

# 是否将访问说明符后的代码缩进一级。若为 true，此选项强制 'indent_access_spec=0'。
indent_access_spec_body = false # true/false

# 若左括号后跟换行，是否缩进下一行使其与左括号对齐（不推荐）。
indent_paren_nl = false # true/false

# 换行后闭括号的缩进方式。
#
# 0: 缩进至代码体层级（默认）
# 1: 与左括号对齐
# 2: 缩进至大括号层级
# -1: 保留原始缩进
indent_paren_close = 0 # number

# 若函数定义的括号单独成行，是否缩进该左括号。
indent_paren_after_func_def = false # true/false

# 若函数声明的括号单独成行，是否缩进该左括号。
indent_paren_after_func_decl = false # true/false

# 若函数调用的括号单独成行，是否缩进该左括号。
indent_paren_after_func_call = false # true/false

# 大括号内逗号的缩进方式。
# 0: 缩进一级（默认）
# 1: 与左大括号对齐
# -1: 保留原始缩进
indent_comma_brace = 0 # number

# 圆括号内逗号的缩进方式。
# 0: 缩进一级（默认）
# 1: 与左圆括号对齐
# -1: 保留原始缩进
indent_comma_paren = 0 # number

# 圆括号内布尔运算符的缩进方式。
# 0: 缩进一级（默认）
# 1: 与左圆括号对齐
# -1: 保留原始缩进
indent_bool_paren = 0 # number

# 圆括号外布尔运算符的缩进是否忽略。
indent_ignore_bool = false # true/false

# 是否在布尔表达式嵌套的每一层额外缩进一级
indent_bool_nested_all = false # true/false

# 是否忽略算术运算符的缩进。
indent_ignore_arith = false # true/false

# for 括号内分号是否缩进。若为 true，则与左 for 括号对齐。
indent_semicolon_for_paren = false # true/false

# for 语句外分号的缩进是否忽略。
indent_ignore_semicolon = false # true/false

# 若 indent_bool_paren=1，是否将第一个表达式与后续对齐。
indent_first_bool_expr = false # true/false

# 若 indent_semicolon_for_paren=true，是否将第一个表达式与后续对齐。
indent_first_for_expr = false # true/false

# 若左方括号后跟换行，是否缩进下一行使其与左方括号对齐（不推荐）。
indent_square_nl = false # true/false

# (ESQL/C) 是否保留 'EXEC SQL' 主体的相对缩进。
indent_preserve_sql = false # true/false

# 是否忽略赋值运算符的缩进。
indent_ignore_assign = false # true/false

# 续写语句是否在 '=' 处对齐。若为 false 或 '=' 后跟换行，则下一行缩进一个 tab。
#
# 默认值: true
indent_align_assign = false # true/false

# 若为 true，'=' 后各段的缩进将设为 '=' 前 LHS token 的缩进列。
indent_off_after_assign = false # true/false

# 续写语句是否在 '(' 处对齐。若为 false 或 '(' 后跟换行，则下一行缩进一个 tab。
#
# 默认值: true
indent_align_paren = false # true/false

# (OC) 是否缩进 Objective-C 消息选择器内的代码。
indent_oc_inside_msg_sel = false # true/false

# (OC) Objective-C 块是否按大括号层级缩进，而非常规规则。
indent_oc_block = false # true/false

# (OC) Objective-C 消息中块的缩进，相对于参数名。
#
# =0: 使用 indent_oc_block 规则
# >0: 使用指定的空格数缩进
indent_oc_block_msg = 0 # unsigned number

# (OC) 后续参数的最小缩进
indent_oc_msg_colon = 0 # unsigned number

# (OC) 是否优先与初始冒号对齐（必要时从行中去除空格）。
#
# 默认值: true
indent_oc_msg_prioritize_first_colon = false # true/false

# (OC) 是否按 Xcode 默认方式缩进块（参数单独成行时从关键字开始缩进；否则从上一缩进层级开始）。需要 indent_oc_block_msg=true。
indent_oc_block_msg_xcode_style = false # true/false

# (OC) 相对于消息关键字，大括号处的块缩进方式。需要 indent_oc_block_msg=true。
indent_oc_block_msg_from_keyword = false # true/false

# (OC) 相对于消息冒号，大括号处的块缩进方式。需要 indent_oc_block_msg=true。
indent_oc_block_msg_from_colon = false # true/false

# (OC) Whether to indent blocks from where the block caret is.
# Requires indent_oc_block_msg=true.
indent_oc_block_msg_from_caret = false # true/false

# (OC) Whether to indent blocks from where the brace caret is.
# Requires indent_oc_block_msg=true.
indent_oc_block_msg_from_brace = false # true/false

# 在虚拟大括号打开和换行后缩进时，添加更多空格以达到此最小缩进。
indent_min_vbrace_open = 0 # unsigned number

# 在虚拟大括号打开和换行后缩进时，是否添加更多空格以到达下一个 tab 停止位。
indent_vbrace_open_on_tabstop = false # true/false

# 大括号后跟另一 token（不是换行）时的缩进方式。
# true: 所有包含的行缩进以匹配该 token
# false: 所有包含的行缩进以匹配大括号
#
# 默认值: true
indent_token_after_brace = false # true/false

# 是否缩进 C++11 lambda 的主体。
indent_cpp_lambda_body = true # true/false

# 如何缩进正在返回的复合字面量。
# true: 同时添加 return 的缩进和复合字面量左大括号的缩进（即 2 级缩进）
# false: 仅缩进 1 级，不添加左大括号的缩进，只添加 return 的缩进。
#
# 默认值: true
indent_compound_literal_return = false # true/false

# (C#) Whether to indent a 'using' block if no braces are used.
#
# Default: true
indent_using_block = false # true/false

# 如何缩进三元运算符的续写部分。
#
# 0: 关闭（默认）
# 1: 若 `if_false` 是续写，则缩进至 `if_true` 分支下
# 2: 若 `:` 是续写，则缩进至 `?` 下
indent_ternary_operator = 0 # unsigned number

# 是否缩进三元运算符内的语句。
indent_inside_ternary_operator = false # true/false

# 若为 true，`return` 后各段的缩进将设为 return 缩进列。
indent_off_after_return = false # true/false

# 若为 true，`return new` 后各段的缩进将设为 return 缩进列。
indent_off_after_return_new = false # true/false

# 若为 true，return 后的 token 使用常规单级缩进。默认（false）缩进在 return token 之后。
indent_single_after_return = false # true/false

# 是否忽略 'asm' 块的缩进和对齐（即假定它们有自己的缩进）。
indent_ignore_asm_block = false # true/false

# 若函数定义的右括号单独成行，不缩进该右括号。
donot_indent_func_def_close_paren = false # true/false


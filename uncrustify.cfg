mod_sort_incl_import_prioritize_extensionless = true # true/false

# 排序启用时，是否优先处理尖括号而非引号的 '#include' 和 '#import' 语句。
mod_sort_incl_import_prioritize_angle_over_quotes = false # true/false

# 排序比较时是否忽略 '#include' 和 '#import' 语句的文件扩展名。
mod_sort_incl_import_ignore_extension = false # true/false

# 排序启用时是否对 '#include' 和 '#import' 语句分组。
mod_sort_incl_import_grouping_enabled = true # true/false

# 是否将完全大括号 'case' 后出现的 'break' 移到闭大括号前，如 'case X: { ... } break;' => 'case X: { ... break; }'。
mod_move_case_break = true # true/false

# 是否将完全大括号 'case' 后出现的 'return' 移到闭大括号前，如 'case X: { ... } return;' => 'case X: { ... return; }'。
mod_move_case_return = true # true/false

# 完全大括号 case 语句是否添加或移除大括号。仅在块中无变量声明时才会移除大括号。
mod_case_brace = force # ignore/remove/force

# 是否移除作为函数最后一条语句的 void 'return;'。
mod_remove_empty_return = false # true/false

# 枚举最后一个值后是否添加或移除逗号。
mod_enum_last_comma = force # ignore/remove/force

# 无限循环使用的语法。
#
# 0: 保持原语法（默认）
# 1: 改写为 `for(;;)`
# 2: 改写为 `while(true)`
# 3: 改写为 `do`...`while(true);`
# 4: 改写为 `while(1)`
# 5: 改写为 `do`...`while(1);`
#
# 不匹配上述任一语法的无限循环将被忽略。
# 其他影响循环格式化的选项将在语法转换后应用。
mod_infinite_loop = 2 # unsigned number

# 'int short' 是否添加或移除 'int' 关键字。
mod_int_short = remove # ignore/remove/force

# 'short int' 是否添加或移除 'int' 关键字。
mod_short_int = remove # ignore/remove/force

# 'int long' 是否添加或移除 'int' 关键字。
mod_int_long = remove # ignore/remove/force

# 'long int' 是否添加或移除 'int' 关键字。
mod_long_int = remove # ignore/remove/force

# 'int signed' 是否添加或移除 'int' 关键字。
mod_int_signed = remove # ignore/remove/force

# 'signed int' 是否添加或移除 'int' 关键字。
mod_signed_int = remove # ignore/remove/force

# 'int unsigned' 是否添加或移除 'int' 关键字。
mod_int_unsigned = remove # ignore/remove/force

# 'unsigned int' 是否添加或移除 'int' 关键字。
mod_unsigned_int = remove # ignore/remove/force

# 若 mod_int_* 和 mod_*_int 可能产生多个 int 关键字，保留最右边的 int（默认）还是最左边的 int。
mod_int_prefer_int_on_left = false # true/false

# (OC) Whether to organize the properties. If true, properties will be
# rearranged according to the mod_sort_oc_property_*_weight factors.
mod_sort_oc_properties = false # true/false

# (OC) Weight of a class property modifier.
mod_sort_oc_property_class_weight = 0 # number

# (OC) Weight of 'atomic' and 'nonatomic'.
mod_sort_oc_property_thread_safe_weight = 0 # number

# (OC) Weight of 'readwrite' when organizing properties.
mod_sort_oc_property_readwrite_weight = 0 # number

# (OC) Weight of a reference type specifier ('retain', 'copy', 'assign',
# 'weak', 'strong') when organizing properties.
mod_sort_oc_property_reference_weight = 0 # number

# (OC) Weight of getter type ('getter=') when organizing properties.
mod_sort_oc_property_getter_weight = 0 # number

# (OC) Weight of setter type ('setter=') when organizing properties.
mod_sort_oc_property_setter_weight = 0 # number

# (OC) Weight of nullability type ('nullable', 'nonnull', 'null_unspecified',
# 'null_resettable') when organizing properties.
mod_sort_oc_property_nullability_weight = 0 # number

#
# 预处理器选项
#

# 缩进预处理器代码时如何使用制表符。
#
# -1: 使用 'indent_with_tabs' 设置（默认）
# 0: 仅空格
# 1: 用制表符缩进到大括号级别，用空格对齐
# 2: 用制表符缩进和对齐，不在制表位时用空格
#
# 默认值: -1
pp_indent_with_tabs = 0 # number

# 大括号级别 0（文件级）#if 块内的预处理器指令是否添加或移除缩进。
pp_indent = ignore # ignore/remove/force

# #if/#else/#endif 是否按大括号级别缩进。若为 false，从第 1 列缩进。
pp_indent_at_level = false # true/false

# 若大括号级别为 0，#if/#else/#endif 是否按括号级别缩进。若为 false，从第 1 列缩进。
pp_indent_at_level0 = false # true/false

# 大括号级别 0（文件级）每级缩进的列数。若 pp_indent_at_level=false，也指定每级缩进的列数
# 大括号级别 > 0（函数级）时也适用。
#
# 默认值: 1
pp_indent_count = 1 # unsigned number

# 根据 #if 块的 pp 级别，# 后是否添加或移除空格。
pp_space_after = ignore # ignore/remove/force

# pp_space_after 每级添加的空格数。
pp_space_count = 0 # unsigned number

# C# 的 '#region' 和 '#endregion' 及 C/C++ 的 '#pragma region' 的缩进。负值递减缩进至第 1 列。
pp_indent_region = 0 # number

# '#region' 和 '#endregion' 之间的代码是否缩进。
pp_region_indent_code = false # true/false

# 若 pp_indent_at_level=true，设置非文件级 #if、#else 和 #endif 的缩进。负值递减缩进至第 1 列。
#
# =0: 使用 output_tab_size 缩进预处理器
# >0: 所有预处理器缩进至的列
pp_indent_if = 0 # number

# #if、#else 和 #endif 之间的代码是否缩进。
pp_if_indent_code = false # true/false

# 包含整个文件的 #if 体是否缩进。
pp_indent_in_guard = false # true/false

# '#define' 是否按大括号级别缩进。若为 false，从第 1 列缩进。
pp_define_at_level = false # true/false

# '#include' 是否按大括号级别缩进。
pp_include_at_level = false # true/false

# 格式化时是否忽略 '#define' 体。
pp_ignore_define_body = false # true/false

# 控制多行 #define 体缩进的偏移值。'body' 指多行 #define 除第一行外的所有行。需要 'pp_ignore_define_body = false'。
#
# <0: 绝对列：体缩进从指定列开始
# （例：-3 ==> 体从第 3 列开始缩进）
# >=0: 相对于 '#define' 中 '#' 的列
# （例：3 ==> 体从 '#' 右侧 3 列开始缩进）
#
# 默认值: 8
pp_multiline_define_body_indent = 8 # number

# #if、#else 和 #endif 中的 case 语句是否缩进。
# 仅适用于 case 语句直接所在的预处理器的缩进。
#
# 默认值: true
pp_indent_case = false # true/false

# #if、#else 和 #endif 中的整个函数定义是否缩进。
# 仅适用于函数定义直接所在的预处理器的缩进。
#
# 默认值: true
pp_indent_func_def = false # true/false

# #if、#else 和 #endif 中的 extern C 块是否缩进。
# 仅适用于 extern 块直接所在的预处理器的缩进。
#
# 默认值: true
pp_indent_extern = false # true/false

# #if、#else 和 #endif 内部大括号的缩进方式。
# 需要 pp_if_indent_code=true，且仅适用于大括号直接所在预处理器的缩进。
# 0: 不额外缩进
# 1: 多缩进一级
# -1: 保留原始缩进
#
# 默认值: 1
pp_indent_brace = 1 # number

# 发现不平衡的 #if 和 #else 块时执行的操作。
# 0: 不做任何事
# 1: 打印警告信息
# 2: 以错误终止程序 (EX_SOFTWARE)
#
# 以下情况会触发该操作：
# - 若 #ifdef 块结束的缩进级别与其开始时不同。例如：
#
# #ifdef TEST
# int i;
# {
# int j;
# #endif
pp_unbalanced_if_action = 2 # unsigned number

#
# 排序 include 选项
#

# 优先级 0 的 include 类别正则表达式。
include_category_0 = "" # string

# 优先级 1 的 include 类别正则表达式。
include_category_1 = "" # string

# 优先级 2 的 include 类别正则表达式。
include_category_2 = "" # string

#
# 使用与否选项
#

# true: 使用 indent_func_call_param（默认）
# false: 不使用 indent_func_call_param
#
# 默认值: true
use_indent_func_call_param = false # true/false

# 续行缩进值的计算方式因语句类型而异：
# - 声明：你的情况是 QString fileName ...
# - 赋值：你的情况是 pSettings = new QSettings( ...
#
# 第二种情况下缩进值可能会被使用两次：
# - at the assignment
# - at the function call (if present)
#
# 若要防止缩进值被双重使用将此选项设为 'true'。
#
# true: indent_continue 仅使用一次
# false: indent_continue 每次都使用（默认）
#
# 需要 indent_ignore_first_continue=false。
use_indent_continue_only_once = false # true/false

# 缩进可以是：
# - 赋值后在 '[' 字符处
# - lambda 体开头
#
# true: 缩进在 lambda 体开头
# false: 缩进在赋值后（默认）
indent_cpp_lambda_only_once = false # true/false

# sp_after_angle 是否优先于 sp_inside_fparen。这是历史行为，但可能不是预期行为，因此默认关闭。
use_sp_after_angle_always = false # true/false

# 是否对 Qt SIGNAL/SLOT 宏应用特殊格式化。本质上，这会使它们格式化为 Qt 规范化形式（即 QMetaObject::normalizedSignature 的结果），可略微提升 QObject::connect 调用的性能。
#
# 详见 options_for_QT.cpp。
#
# 默认值: true
use_options_overriding_for_qt_macros = false # true/false

# 若为 true：换页符从空白字符列表中移除。详见 https://en.cppreference.com/w/cpp/string/byte/isspace。
use_form_feed_no_more_as_whitespace_character = false # true/false

#
# 警告级别 - 1: 错误，2: 警告（默认），3: 提示
#

# (C#) Warning is given if doing tab-to-\t replacement and we have found one
# in a C# verbatim string literal.
#
# Default: 2
warn_level_tabs_found_in_verbatim_string_literals = 2 # unsigned number

# 限制循环次数。
# uncrustify.cpp 用此从无限循环中退出。
# 0: 无限制。
debug_max_number_of_loops = 0 # number

# 设置要记录的行号；
# 若第二个参数为零则在 prot_the_line 函数中使用。
# 0: 不记录。
debug_line_number_to_protocol = 0 # number

# 设置格式化当前文件前等待的秒数，
# 0: 无超时。
# 仅限 linux
debug_timeout = 0 # number

# 文本过长时设置要打印的字符数，
# 0: 不截断。
debug_truncate = 0 # unsigned number

# 是否对跟踪信息排序。
#
# 默认值: true
debug_sort_the_tracks = false # true/false

# 是否将标志解码为新行。
# 仅在设置了 -p 选项时有效。
debug_decode_the_flags = false # true/false

# 是否使用 exit(EX_SOFTWARE) 函数。
#
# 默认值: true
debug_use_the_exit_function_pop = false # true/false

# 是否在 -o 命令行选项指定的文件中打印版本。
debug_print_version = false # true/false

# 在每行开头插入行号
set_numbering_for_html_output = false # true/false

# 设置含义：
# Ignore - 不做任何更改
# Force - 确保恰好有 1 个空格/大括号/换行等，在某些上下文中行为与 Add 相同
# Remove - 移除空格/大括号/换行等
#
#
# - 可用 'set' 选项将 token(s) 视为特定类型：
# `set tokenType tokenString [tokenString...]`
#
# 示例：
# `set BOOL __AND__ __OR__`
#
# tokenTypes 定义在 src/token_enum.h 中，使用时不带
# 'E_Token::CT_' 前缀：'E_Token::CT_BOOL' => 'BOOL'
#
#
# - 可用 'type' 选项将 token(s) 视为类型：
# `type tokenString [tokenString...]`
#
# 示例：
# `type int c_uint_8 Rectangle`
#
# 这也可以通过 `set TYPE int c_uint_8 Rectangle` 实现
#
#
#
# 若要在 tokenStrings 中嵌入空白字符，使用 '\' 转义字符，或用引号包围 tokenStrings。支持这些引号："'\`"
#
#
# - 可用 'file_ext' 命令添加通过文件扩展名自动检测语言的支持。
# `file_ext langType langString [langString..]`
#
# 示例：
# `file_ext CPP .ch .cxx .cpp.in`
#
# langTypes 定义在 uncrustify_types.h 的 lang_flag_e 枚举中，使用时不带 'LANG_' 前缀：'LANG_CPP' => 'CPP'
#
#
# - 可用 'macro-open'、'macro-else' 和 'macro-close' 设置自定义宏缩进。
# `(macro-open | macro-else | macro-close) tokenString`
#
# 示例：
# `macro-open BEGIN_TEMPLATE_MESSAGE_MAP`
# `macro-open BEGIN_MESSAGE_MAP`
# `macro-close END_MESSAGE_MAP`
#
# 选项默认值为 0
#

# 访问说明符标签前的换行数。也包括 Qt 特有的 'signals:' 和 'slots:'。若在左大括号后则不改变换行数。0: 无变化（默认）。
nl_before_access_spec = 1 # unsigned number

# 访问说明符标签后的换行数。也包括 Qt 特有的 'signals:' 和 'slots:'。若在左大括号后则不改变换行数。

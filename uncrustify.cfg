align_right_cmt_at_col = 0 # unsigned number

# 函数原型对齐的跨度。
#
# 0: 不对齐（默认）。
align_func_proto_span = 0 # unsigned number

# 评估函数原型对齐跨度的新行数时是否忽略续行。

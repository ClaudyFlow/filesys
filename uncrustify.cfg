# >0: 候选之间最多跳过此数量的注释行。
#
# 默认值: -1
align_typedef_span_num_cmt_lines = -1 # number

# typedef 中类型与同义词之间的最小空格数。
align_typedef_gap = 0 # unsigned number

# 如何将 typedef 函数与其他 typedef 对齐。

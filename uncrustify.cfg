align_func_proto_star_style = 0 # unsigned number

# 函数原型对齐中如何处理 '&'。
#
# 0: 类型的一部分，'long & foo();'（默认）
# 1: 函数的一部分，'long &foo();'
# 2: 悬挂，'long &foo();'
# 悬挂：对齐时不考虑 '&'。
align_func_proto_amp_style = 0 # unsigned number

# 函数原型对齐的阈值。使用负数表示绝对阈值。
#
# 0: 无限制（默认）。
align_func_proto_thresh = 0 # number

# 返回类型与函数名之间的最小间隙。
align_func_proto_gap = 0 # unsigned number

# 函数原型是否按 'operator' 关键字对齐，而非后续内容。
align_on_operator = false # true/false

# 是否混合对齐原型与变量声明。若为 true，使用 align_var_def_XXX 选项而非 align_func_proto_XXX 选项。
align_mix_var_proto = false # true/false

# 单行函数是否与函数原型对齐。使用 align_func_proto_span。
align_single_line_func = false # true/false

# 单行函数的左大括号是否对齐。需要 align_single_line_func=true。使用 align_func_proto_span。
align_single_line_brace = false # true/false

# align_single_line_brace 的间隙。
align_single_line_brace_gap = 0 # unsigned number

# (OC) Objective-C 消息规格对齐的跨度。
#
# 0: 不对齐（默认）。
align_oc_msg_spec_span = 0 # unsigned number

# 是否及如何对齐将宏拆分为多行的反斜杠。若宏包含多行注释，此选项无法正常工作。
#
# 0: 不做任何事（默认）
# 1: 在最长行末尾的列中对齐反斜杠
# 2: 与最左侧的反斜杠对齐，或若该反斜杠比最长行末尾更靠左，则在最长行末尾对齐
# 3: 与最右侧的反斜杠对齐
align_nl_cont = 0 # unsigned number

# 行末与其续行反斜杠之间的最小空格数。需要 align_nl_cont。
#
# 默认值: 1
align_nl_cont_spaces = 1 # unsigned number

# 是否将宏函数与变量一起对齐。
align_pp_define_together = false # true/false

# '#define' 体对齐的跨度。
#
# =0: 不对齐（默认）
# >0: 块之间的行数（包括注释）
align_pp_define_span = 0 # unsigned number

# 预处理 define 的标签与值之间的最小空格数。
align_pp_define_gap = 0 # unsigned number

# 是否将 '<<' 开头的行与前面的 '<<' 对齐。
#
# 默认值: true
align_left_shift = false # true/false

# 是否对齐 '<<' 后面的逗号分隔语句（如用于初始化 Eigen 矩阵）。
align_eigen_comma_init = false # true/false

# 是否对齐 'asm volatile ()' 冒号后的文本。
align_asm_colon = false # true/false

# (OC) Objective-C 消息调用中参数按 ':' 对齐的跨度。

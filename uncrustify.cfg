align_oc_msg_colon_span = 0 # unsigned number

# (OC) 是否始终与第一个参数对齐，即使它太短。
align_oc_msg_colon_first = false # true/false

# (OC) Objective-C '+' 或 '-' 声明中参数是否按 ':' 对齐。
align_oc_decl_colon = false # true/false

# (OC) 若第一个冒号不在消息调用的下一行，Objective-C 消息调用中的参数是否不对齐（与 Xcode 对齐方式相同）
align_oc_msg_colon_xcode_like = false # true/false

#
# 注释修改选项
#

# 尝试在 N 列处换行注释。
cmt_width = 0 # unsigned number

# 如何重新排列注释。
#
# 0: 不重新排列（除 cmt_width 导致的换行）（默认）
# 1: 完全不碰

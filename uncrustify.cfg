# Uncrustify-0.83.0_f

#
# 通用选项
#

# 行结尾类型。
newlines = lf # lf/crlf/cr/auto

# 输入中 Tab 的原始宽度。
input_tab_size = 4 # unsigned number

# 输出中 Tab 的宽度（仅在 align_with_tabs=true 时生效）。
output_tab_size = 4 # unsigned number

# 字符串转义符的 ASCII 值，通常为 92 (\) 或（Pawn）94 (^)。
string_escape_char = 92 # unsigned number

# 备用字符串转义符（通常仅用于 Pawn）。
# 仅在引号前生效。
string_escape_char2 = 0 # unsigned number

# 将字符串字面量中的 Tab 替换为转义序列 \t。
string_replace_tab_chars = false # true/false

# 允许将 '>=' 和 '>>=' 解析为模板的一部分，如 'void f(list<list<B>>=val);'。
# 若设为 true，则 'assert(x<0 && y>=3)' 会被错误拆分。
# 模板检测的改进可能使此选项被淘汰。
tok_split_gte = false # true/false

# 禁用 NL_CONT（'\n'）结尾行的格式化（如多行宏）。
disable_processing_nl_cont = false # true/false

# 指定注释中用于禁用部分文件处理的标记。
#
# 默认值: *INDENT-OFF*
disable_processing_cmt = " *INDENT-OFF*" # string

# 指定注释中用于重新启用处理的标记。
#
# 默认值: *INDENT-ON*
enable_processing_cmt = " *INDENT-ON*" # string

# 启用双字符解析。
enable_digraphs = false # true/false

# 允许将 disable_processing_cmt 和 enable_processing_cmt
# 指定的字符串解释为 ECMAScript 正则表达式。
# 若设为 true，则按指定模式在注释中执行正则搜索，以禁用/启用处理。
processing_cmt_as_regex = false # true/false

# 添加或移除 UTF-8 BOM（建议设为 'remove'）。
utf8_bom = remove # ignore/remove/force

# 若文件包含值为 128-255 的字节但非 UTF-8，则输出为 UTF-8。
utf8_byte = true # true/false

# 强制将输出编码设为 UTF-8。
utf8_force = true # true/false

#
# 空格选项
#

# 在非赋值符号运算符（'+', '/', '%', '<<' 等）周围添加或移除空格。
sp_arith = force # ignore/remove/force

# 在赋值运算符 '='、'+=' 等周围添加或移除空格。
sp_assign = force # ignore/remove/force

# 在 C++11 lambda 捕获规范中的 '=' 周围添加或移除空格。
sp_cpp_lambda_assign = remove # ignore/remove/force

# 在 C++11 lambda 的捕获规范之后、参数列表之前添加或移除空格，
# 如 '[] <这里> (int x){ ... }'。
sp_cpp_lambda_square_paren = remove # ignore/remove/force

# 在无参数列表的 C++11 lambda 捕获规范之后添加或移除空格，
# 如 '[] <这里> { ... }'。
sp_cpp_lambda_square_brace = force # ignore/remove/force

# 在空参数列表的 C++11 lambda 中，开括号 '(' 和闭括号 ')' 之间添加或移除空格，
# 如 '[]( <这里> ){ ... }'。
sp_cpp_lambda_argument_list_empty = remove # ignore/remove/force

# 在非空参数列表的 C++11 lambda 中，开括号 '(' 和闭括号 ')' 之间添加或移除空格，
# 如 '[]( <这里> int x <这里> ){ ... }'。
sp_cpp_lambda_argument_list = remove # ignore/remove/force

# 在C++11 lambda的参数列表（闭括号 ')'）和开括号 '{' 之间添加或移除空格，
# '[](int x) <这里> { ... }'.
sp_cpp_lambda_paren_brace = force # ignore/remove/force

# 在立即调用的lambda的函数体（'{' '}'）和调用操作符 '()' 之间添加或移除空格，
# 如 '[]( ... ){ ... } <这里> ( ... )'。
sp_cpp_lambda_fparen = remove # ignore/remove/force

# 在 'enum {' 中添加或移除空格。
sp_enum_brace = force # ignore/remove/force

# 在 'NS_ENUM (' 中添加或移除空格。
sp_enum_paren = force # ignore/remove/force

# 在enum内部，赋值操作符 '=' 周围添加或移除空格。
sp_enum_assign = force # ignore/remove/force

# 在enum内部，冒号 ':' 周围添加或移除空格。
sp_enum_colon = force # ignore/remove/force

# 在预处理器的 '##' 连接操作符周围添加或移除空格。
sp_pp_concat = remove # ignore/remove/force

# 在预处理器 '#' 字符串化操作符之后添加或移除空格。
# 同时影响 '#@' 字符化操作符。
sp_pp_stringify = remove # ignore/remove/force

# 在预处理器 '#' 字符串化操作符之前添加或移除空格，
# 如 '#define x(y) L#y'。
sp_before_pp_stringify = remove # ignore/remove/force

# 在布尔操作符 '&&' 和 '||' 周围添加或移除空格。
sp_bool = force # ignore/remove/force

# 在比较操作符 '<'、'>'、'==' 等周围添加或移除空格。
sp_compare = force # ignore/remove/force

# 在 '(' 和 ')' 内部添加或移除空格。
sp_inside_paren = remove # ignore/remove/force

# 在嵌套括号之间添加或移除空格，即 '((' vs. ') )'。
sp_paren_paren = remove # ignore/remove/force

# 在连续括号之间添加或移除空格，即 ')(' vs. ') ('。
sp_cparen_oparen = remove # ignore/remove/force

# 在 ')' 和 '{' 之间添加或移除空格。
sp_paren_brace = force # ignore/remove/force

# 在嵌套大括号之间添加或移除空格，即 '{{' vs. '{ {'。
sp_brace_brace = remove # ignore/remove/force

# 在指针星号 '*' 之前添加或移除空格。
sp_before_ptr_star = remove # ignore/remove/force

# 在多个指针星号 '*' 之间添加或移除空格，如 'int ***a;'。
sp_between_ptr_star = remove # ignore/remove/force

# 在指针星号 '*' 和引用 '&' 之间添加或移除空格，如 'int *& a;'。
sp_between_ptr_ref = remove # ignore/remove/force

# 在指针星号 '*' 之后添加或移除空格（若后接标识符）。
sp_after_ptr_star = force # ignore/remove/force

# 在指针脱字符 '^' 后添加或移除空格（若后接标识符）。
sp_after_ptr_block_caret= force # ignore/remove/force

# 在指针星号 '*' 之后添加或移除空格（若后接限定符）。
sp_after_ptr_star_qualifier = force # ignore/remove/force

# 在指针星号 '*' 后添加或移除空格（若后接函数原型或函数定义）。
sp_after_ptr_star_func = force # ignore/remove/force

# 在函数原型或函数定义的尾部返回类型中，对指针星号 '*' 后添加或移除空格。
sp_after_ptr_star_trailing = force # ignore/remove/force

# 在函数指针定义中，对指针星号 '*' 与变量名之间添加或移除空格。
sp_ptr_star_func_var = remove # ignore/remove/force

# 在函数指针类型定义中，对指针星号 '*' 与类型名之间添加或移除空格。
sp_ptr_star_func_type = remove # ignore/remove/force

# 在指针星号 '*' 后添加或移除空格（若后接左圆括号），如 'void* (*)()'。
sp_ptr_star_paren = force # ignore/remove/force

# 在函数原型或函数定义的尾部返回类型中，对指针星号 '*' 前添加或移除空格。
sp_before_ptr_star_trailing = remove # ignore/remove/force

# 在函数原型或函数定义的尾部返回类型中，对限定符与指针星号 '*' 之间添加或移除空格，如 'auto foo() -> char const *'。
sp_qualifier_ptr_star_trailing = remove # ignore/remove/force

# 在引用符号 '&' 前添加或移除空格。
sp_before_byref = remove # ignore/remove/force

# 在引用符号 '&' 后添加或移除空格（若后接标识符）。
sp_after_byref = force # ignore/remove/force

# 在引用符号 '&' 后添加或移除空格（若后接函数原型或函数定义）。
sp_after_byref_func = force # ignore/remove/force

# 在引用符号 '&' 前添加或移除空格（若后接函数原型或函数定义）。
sp_before_byref_func = remove # ignore/remove/force

# 在引用符号 '&' 后添加或移除空格（若后接左圆括号），如 'char& (*)()'。
sp_byref_paren = force # ignore/remove/force

# 在成员函数的引用限定符 '&' 或 '&&' 前添加或移除空格。
sp_before_ref_qualifier = remove # ignore/remove/force

# 在成员函数的引用限定符 '&' 或 '&&' 后添加或移除空格。
sp_after_ref_qualifier = force # ignore/remove/force

# 在类型与标识符之间添加或移除空格。若完全移除空格会导致语法错误，则 'remove' 等效于 'force'。
#
# 此选项还影响其他未由其他选项覆盖的场景：例如函数类型模板参数中返回类型与圆括号之间、
# 数组参数中类型与圆括号之间，或 'decltype(...)' 与后续标识符之间。
#
# 默认值: force
sp_after_type = force # ignore/remove/force

# 在 'decltype(...)' 与标识符、大括号或函数调用之间添加或移除空格。
sp_after_decltype = force # ignore/remove/force

# (D) Add or remove space before the parenthesis in the D constructs
# 'template Foo(' and 'class Foo('.
sp_before_template_paren = ignore # ignore/remove/force

# 在 '<' 前添加或移除空格。
sp_before_angle = remove # ignore/remove/force

# 在 '<' 和 '>' 内部添加或移除空格。
sp_inside_angle = remove # ignore/remove/force

# 在 '<>' 内添加或移除空格（空模板参数时）。
sp_inside_angle_empty = remove # ignore/remove/force

# 在 '>' 和 ':' 之间添加或移除空格。
sp_angle_colon = force # ignore/remove/force

# 在 '>' 后添加或移除空格。
sp_after_angle = force # ignore/remove/force

# 在 '>' 和 '(' 之间添加或移除空格，如 'new List<byte>(foo);'。
sp_angle_paren = remove # ignore/remove/force

# 在 '>' 和 '()' 之间添加或移除空格，如 'new List<byte>();'。
sp_angle_paren_empty = remove # ignore/remove/force

# 在 '>' 和标识符之间添加或移除空格，如 'List<byte> m;' 或 'template <typename T> static ...'。
sp_angle_word = force # ignore/remove/force

# 在 '>>' 中两个 '>' 之间添加或移除空格（模板嵌套）。
sp_angle_shift = remove # ignore/remove/force

# (C++11) 允许在 'foo<bar<int> >' 中移除 '>>' 之间的空格。注意 sp_angle_shift 需开启此选项才能移除空格。
sp_permit_cpp11_shift = true # true/false

# 在控制语句（'if', 'for', 'switch', 'while' 等）的 '(' 前添加或移除空格。
sp_before_sparen = force # ignore/remove/force

# 在控制语句（除 'for' 外）的 '(' 和 ')' 内部添加或移除空格。
sp_inside_sparen = remove # ignore/remove/force

# 在 'for' 语句的 '(' 和 ')' 内部添加或移除空格。
sp_inside_for = remove # ignore/remove/force

# 在控制语句的 '((' 或 '))' 之间添加或移除空格。
sp_sparen_paren = remove # ignore/remove/force

# 在控制语句的 ')' 后添加或移除空格。
sp_after_sparen = remove # ignore/remove/force

# 在控制语句的 ')' 与 '{' 之间添加或移除空格。
sp_sparen_brace = force # ignore/remove/force

# 在 'do' 与 '{' 之间添加或移除空格。
sp_do_brace_open = force # ignore/remove/force

# 在 '}' 与 'while' 之间添加或移除空格。
sp_brace_close_while = force # ignore/remove/force

# (D) 在 'invariant' 与 '(' 之间添加或移除空格。
sp_invariant_paren = ignore # ignore/remove/force

# (D) Add or remove space after the ')' in 'invariant (C) c'.
sp_after_invariant_paren = ignore # ignore/remove/force

# 在 'if'、'for'、'while' 的空语句 ';' 前添加或移除空格。
# 示例：
# if (b)<空格>;
# for (a=1; a<10; a++)<空格>;
# while (*p++ = ' ')<空格>;
sp_special_semi = remove # ignore/remove/force

# 在 ';' 前添加或移除空格。
sp_before_semi = remove # ignore/remove/force

# 在非空 'for' 语句的 ';' 前添加或移除空格。
sp_before_semi_for = remove # ignore/remove/force

# 在 for 语句空左侧分号前添加或移除空格，如 'for ( <这里> ; ; )'。
sp_before_semi_for_empty = remove # ignore/remove/force

# 在 for 语句空中间部分两分号之间添加或移除空格，如 'for ( ; <这里> ; )'。
sp_between_semi_for_empty = remove # ignore/remove/force

# 在 ';' 后添加或移除空格（后接注释时除外）。
sp_after_semi = remove # ignore/remove/force

# 在非空 'for' 语句的 ';' 后添加或移除空格。
sp_after_semi_for = force # ignore/remove/force

# 在 for 语句空部分的最后一个分号后添加或移除空格，如 'for ( ; ; <这里> )'。
sp_after_semi_for_empty = remove # ignore/remove/force

# 在 '[' 前添加或移除空格（'[]' 除外）。
sp_before_square = remove # ignore/remove/force

# 在变量定义的 '[' 前添加或移除空格。
sp_before_vardef_square = remove # ignore/remove/force

# 在 asm 代码块的 '[' 前添加或移除空格。
sp_before_square_asm_block = remove # ignore/remove/force

# 在 '[]' 前添加或移除空格。
sp_before_squares = remove # ignore/remove/force

# 在 C++17 结构化绑定的引用后添加或移除空格。
sp_cpp_before_struct_binding_after_byref = force # ignore/remove/force

# 在 C++17 结构化绑定前添加或移除空格。
sp_cpp_before_struct_binding = remove # ignore/remove/force

# 在非空 '[' 和 ']' 内部添加或移除空格。
sp_inside_square = remove # ignore/remove/force

# 在 '[]' 内部添加或移除空格（空方括号时）。
sp_inside_square_empty = remove # ignore/remove/force

# (OC) Add or remove space inside a non-empty Objective-C boxed array '@[' and
# ']'. If set to ignore, sp_inside_square is used.
sp_inside_square_oc_array = ignore # ignore/remove/force

# 在 ',' 后添加或移除空格，即 'a,b' 与 'a, b'。
sp_after_comma = force # ignore/remove/force

# 在 ',' 前添加或移除空格，即 'a,b' 与 'a ,b'。
sp_before_comma = remove # ignore/remove/force

# (C#, Vala) Add or remove space between ',' and ']' in multidimensional array type
# like 'int[,,]'.
sp_after_mdatype_commas = ignore # ignore/remove/force

# (C#, Vala) Add or remove space between '[' and ',' in multidimensional array type
# like 'int[,,]'.
sp_before_mdatype_commas = ignore # ignore/remove/force

# (C#, Vala) Add or remove space between ',' in multidimensional array type
# like 'int[,,]'.
sp_between_mdatype_commas = ignore # ignore/remove/force

# 在左圆括号与 ',' 之间添加或移除空格，即 '(,' 与 '( ,'。
sp_paren_comma = remove # ignore/remove/force

# 在类型与 ':' 之间添加或移除空格。
sp_type_colon = force # ignore/remove/force

# 在可变参数 '...' 前为非标点符号时，在 '...' 后添加或移除空格。
# REMOVE 值会被 FORCE 覆盖。
sp_after_ellipsis = force # ignore/remove/force

# 在可变参数 '...' 前为非标点符号时，在 '...' 前添加或移除空格。
# REMOVE 值会被 FORCE 覆盖。
sp_before_ellipsis = force # ignore/remove/force

# 在类型与 '...' 之间添加或移除空格。
sp_type_ellipsis = force # ignore/remove/force

# 在 '*' 与 '...' 之间添加或移除空格。
sp_ptr_type_ellipsis = force # ignore/remove/force

# 在 ')' 与 '...' 之间添加或移除空格。
sp_paren_ellipsis = force # ignore/remove/force

# 在 '&&' 与 '...' 之间添加或移除空格。
sp_byref_ellipsis = force # ignore/remove/force

# 在 ')' 与限定符（如 'const'）之间添加或移除空格。
sp_paren_qualifier = force # ignore/remove/force

# 在 ')' 与 'noexcept' 之间添加或移除空格。
sp_paren_noexcept = force # ignore/remove/force

# 在 PAREN '(' 与解引用 '*' 之间添加或移除空格。
# if ((<这里>*it).startsWith("SCREEN ")) {}
# TQFileInfoListIterator it(<这里>*list);
# if(<这里>*memory == NULL) return;
sp_paren_deref = remove # ignore/remove/force

# 在类的 ':' 后添加或移除空格。
sp_after_class_colon = force # ignore/remove/force

# 在类的 ':' 前添加或移除空格。
sp_before_class_colon = force # ignore/remove/force

# 在类构造函数的 ':' 后添加或移除空格。
sp_after_constr_colon = force # ignore/remove/force

# 在类构造函数的 ':' 前添加或移除空格。
sp_before_constr_colon = force # ignore/remove/force

# 在 case ':' 前添加或移除空格。
sp_before_case_colon = remove # ignore/remove/force

# 在 'operator' 与运算符符号之间添加或移除空格。
sp_after_operator = remove # ignore/remove/force

# 在运算符符号与左圆括号之间添加或移除空格，如 'operator ++('。
sp_after_operator_sym = remove # ignore/remove/force

# 在 C/D 转换后添加或移除空格，即 'cast(int)a' 与 'cast(int) a' 或 '(int)a' 与 '(int) a'。
sp_after_cast = remove # ignore/remove/force

# 在转换括号内部添加或移除空格。
sp_inside_paren_cast = remove # ignore/remove/force

# 在 C++ 转换中类型与左圆括号之间添加或移除空格，即 'int(exp)' 与 'int (exp)'。
sp_cpp_cast_paren = remove # ignore/remove/force

# 在 'sizeof' 与 '(' 之间添加或移除空格。
sp_sizeof_paren = remove # ignore/remove/force

# 在 'sizeof' 与 '...' 之间添加或移除空格。
sp_sizeof_ellipsis = force # ignore/remove/force

# 在 'sizeof...' 与 '(' 之间添加或移除空格。
sp_sizeof_ellipsis_paren = remove # ignore/remove/force

# 在 '...' 与参数包之间添加或移除空格。
sp_ellipsis_parameter_pack = force # ignore/remove/force

# 在参数包与 '...' 之间添加或移除空格。
sp_parameter_pack_ellipsis = force # ignore/remove/force

# 在 'decltype' 与 '(' 之间添加或移除空格。
sp_decltype_paren = remove # ignore/remove/force

# (Pawn) Add or remove space after the tag keyword.
sp_after_tag = ignore # ignore/remove/force

# Add or remove space inside enum '{' and '}'.
sp_inside_braces_enum = remove # ignore/remove/force

# Add or remove space inside struct/union '{' and '}'.
sp_inside_braces_struct = remove # ignore/remove/force

# (OC) Add or remove space inside Objective-C boxed dictionary '{' and '}'
sp_inside_braces_oc_dict = ignore # ignore/remove/force

# 在 '{' 和 '}' 内部添加或移除空格。
sp_inside_braces = remove # ignore/remove/force

# 在 '{}' 内部添加或移除空格（空大括号时）。
sp_inside_braces_empty = remove # ignore/remove/force

# 在尾部返回操作符 '->' 周围添加或移除空格。
sp_trailing_return = force # ignore/remove/force

# 在返回类型与函数名之间添加或移除空格。指针返回类型除外，至少保留1个空格。
sp_type_func = force # ignore/remove/force

# 在类型与匿名临时对象直接列表初始化的左大括号之间添加或移除空格。
sp_type_brace_init_lst = remove # ignore/remove/force

# 在函数声明中函数名与 '(' 之间添加或移除空格。
sp_func_proto_paren = remove # ignore/remove/force

# 在函数声明中函数名与空 '()' 之间添加或移除空格。
sp_func_proto_paren_empty = remove # ignore/remove/force

# 在带 typedef 说明符时函数名与 '(' 之间添加或移除空格。
sp_func_type_paren = remove # ignore/remove/force

# 在非指针函数类型 typedef 的别名与 '(' 之间添加或移除空格。
sp_func_def_paren = remove # ignore/remove/force

# 在空函数 '()' 内部添加或移除空格。除非 use_sp_after_angle_always 为 true，否则覆盖 sp_after_angle。
sp_inside_fparens = remove # ignore/remove/force

# 在函数 '(' 和 ')' 内部添加或移除空格。
sp_inside_fparen = remove # ignore/remove/force

# 在用户仿函数 '(' 和 ')' 内部添加或移除空格。
sp_func_call_user_inside_rparen = remove # ignore/remove/force

# 在空仿函数 '()' 内部添加或移除空格。除非 use_sp_after_angle_always 为 true，否则覆盖 sp_after_angle。
sp_inside_rparens = remove # ignore/remove/force

# 在仿函数 '(' 和 ')' 内部添加或移除空格。
sp_inside_rparen = remove # ignore/remove/force

# 在函数类型第一组括号内部添加或移除空格，如 'void (*x)(...)'。
sp_inside_tparen = remove # ignore/remove/force


align_typedef_star_style = 0 # unsigned number

# typedef 对齐中如何处理 '&'。
#
# 0: typedef 类型的一部分，'typedef int & intref;'（默认）
# 1: 类型名的一部分：'typedef int &intref;'
# 2: 悬挂：'typedef int &intref;'
# 悬挂：对齐时不考虑 '&'。
align_typedef_amp_style = 0 # unsigned number

# 行尾注释对齐的跨度。
#
# 0: 不对齐（默认）。
align_right_cmt_span = 0 # unsigned number

# 前置文本与行尾注释之间的最小列数，注释才有资格参与对齐。必须非零才能生效。
align_right_cmt_gap = 0 # unsigned number

# 若对齐注释，是否混合 '}' 和 #endif 后少于三个空格的注释。
align_right_cmt_mix = false # true/false

# 是否仅对齐同一大括号级别的行尾注释。
align_right_cmt_same_level = false # true/false

